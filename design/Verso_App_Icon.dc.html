<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Hanken+Grotesk:ital,wght@0,400;0,600;0,800;1,800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#E3DFD7;}
</style>
</helmet>

<div style="min-width:100%;min-height:100vh;width:max-content;box-sizing:border-box;padding:56px;background:#E3DFD7;font-family:'Hanken Grotesk',sans-serif;color:#1A1A1A;">

  <div style="display:flex;align-items:baseline;gap:18px;margin-bottom:8px;">
    <span style="font-family:'DM Serif Display',serif;font-size:30px;letter-spacing:0.04em;">VERSO</span>
    <span style="font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#8A857C;">App-Icon</span>
  </div>
  <div style="font-family:'Hanken Grotesk',sans-serif;font-size:13px;color:#6E6A63;max-width:560px;margin-bottom:48px;line-height:1.5;">Kursives „v.“ in drei Farbvarianten — in mehreren Größen und auf dem Homescreen.</div>

  <div style="display:flex;gap:56px;align-items:flex-start;">

    <!-- ============ A — verso wordmark ============ -->
    <div style="display:flex;flex-direction:column;gap:18px;flex:none;">
      <span style="font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.18em;color:#8A857C;">GELB · SCHWARZ</span>
      <div style="width:300px;height:300px;border-radius:68px;background:#FFE500;position:relative;overflow:hidden;box-shadow:0 18px 50px rgba(30,24,18,0.22);display:flex;align-items:center;justify-content:center;">
        <span style="display:inline-flex;align-items:baseline;font-family:'DM Serif Display',serif;font-style:italic;font-size:230px;line-height:1;color:#1A1A1A;transform:translateY(-26px);">v.</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;margin-top:4px;">
        <div style="width:60px;height:60px;border-radius:14px;background:#FFE500;display:flex;align-items:baseline;justify-content:center;box-shadow:0 4px 12px rgba(30,24,18,0.18);"><span style="font-family:'DM Serif Display',serif;font-style:italic;font-size:46px;color:#1A1A1A;">v</span><span style="font-family:'DM Serif Display',serif;font-style:italic;font-size:46px;color:#1A1A1A;">.</span></div>
        <div style="width:42px;height:42px;border-radius:10px;background:#FFE500;display:flex;align-items:baseline;justify-content:center;"><span style="font-family:'DM Serif Display',serif;font-style:italic;font-size:32px;color:#1A1A1A;">v</span><span style="font-family:'DM Serif Display',serif;font-style:italic;font-size:32px;color:#1A1A1A;">.</span></div>
        <span style="font-family:'Hanken Grotesk',sans-serif;font-size:12px;color:#8A857C;">kleine Größen</span>
      </div>
    </div>

    <!-- ============ schwarz / gelb ============ -->
    <div style="display:flex;flex-direction:column;gap:18px;flex:none;">
      <span style="font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.18em;color:#8A857C;">SCHWARZ · GELB</span>
      <div style="width:300px;height:300px;border-radius:68px;background:#1A1A1A;position:relative;overflow:hidden;box-shadow:0 18px 50px rgba(30,24,18,0.22);display:flex;align-items:center;justify-content:center;">
        <span style="display:inline-flex;align-items:baseline;font-family:'DM Serif Display',serif;font-style:italic;font-size:230px;line-height:1;color:#FFE500;transform:translateY(-26px);">v.</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;margin-top:4px;">
        <div style="width:60px;height:60px;border-radius:14px;background:#1A1A1A;display:flex;align-items:baseline;justify-content:center;box-shadow:0 4px 12px rgba(30,24,18,0.18);"><span style="font-family:'DM Serif Display',serif;font-style:italic;font-size:46px;color:#FFE500;">v</span><span style="font-family:'DM Serif Display',serif;font-style:italic;font-size:46px;color:#FFE500;">.</span></div>
        <div style="width:42px;height:42px;border-radius:10px;background:#1A1A1A;display:flex;align-items:baseline;justify-content:center;"><span style="font-family:'DM Serif Display',serif;font-style:italic;font-size:32px;color:#FFE500;">v</span><span style="font-family:'DM Serif Display',serif;font-style:italic;font-size:32px;color:#FFE500;">.</span></div>
        <span style="font-family:'Hanken Grotesk',sans-serif;font-size:12px;color:#8A857C;">kleine Größen</span>
      </div>
    </div>

    <!-- ============ weiß / schwarz ============ -->
    <div style="display:flex;flex-direction:column;gap:18px;flex:none;">
      <span style="font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.18em;color:#8A857C;">WEISS · SCHWARZ</span>
      <div style="width:300px;height:300px;border-radius:68px;background:#F7F4EF;position:relative;overflow:hidden;box-shadow:0 18px 50px rgba(30,24,18,0.22);display:flex;align-items:center;justify-content:center;">
        <span style="display:inline-flex;align-items:baseline;font-family:'DM Serif Display',serif;font-style:italic;font-size:230px;line-height:1;color:#1A1A1A;transform:translateY(-26px);">v.</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;margin-top:4px;">
        <div style="width:60px;height:60px;border-radius:14px;background:#F7F4EF;display:flex;align-items:baseline;justify-content:center;box-shadow:0 4px 12px rgba(30,24,18,0.18);"><span style="font-family:'DM Serif Display',serif;font-style:italic;font-size:46px;color:#1A1A1A;">v</span><span style="font-family:'DM Serif Display',serif;font-style:italic;font-size:46px;color:#1A1A1A;">.</span></div>
        <div style="width:42px;height:42px;border-radius:10px;background:#F7F4EF;display:flex;align-items:baseline;justify-content:center;"><span style="font-family:'DM Serif Display',serif;font-style:italic;font-size:32px;color:#1A1A1A;">v</span><span style="font-family:'DM Serif Display',serif;font-style:italic;font-size:32px;color:#1A1A1A;">.</span></div>
        <span style="font-family:'Hanken Grotesk',sans-serif;font-size:12px;color:#8A857C;">kleine Größen</span>
      </div>
    </div>

    <!-- ============ HOME SCREEN PREVIEW ============ -->
    <div style="display:flex;flex-direction:column;gap:18px;flex:none;">
      <span style="font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.18em;color:#8A857C;">AUF DEM HOMESCREEN</span>
      <div style="width:300px;height:300px;border-radius:40px;overflow:hidden;position:relative;background:#3a4f63;box-shadow:0 18px 50px rgba(30,24,18,0.22);">
        <div style="position:absolute;inset:0;background:linear-gradient(160deg,#5b6f82 0%,#36485a 60%,#26323f 100%);"></div>
        <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(125deg,rgba(255,255,255,0.04) 0 1px,transparent 1px 10px);"></div>
        <div style="position:relative;padding:34px 30px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px 16px;">
          <div style="aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,0.16);"></div>
          <div style="aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,0.16);"></div>
          <div style="aspect-ratio:1;border-radius:14px;background:#FFE500;display:flex;align-items:baseline;justify-content:center;box-shadow:0 6px 14px rgba(0,0,0,0.28);"><span style="font-family:'DM Serif Display',serif;font-style:italic;font-size:44px;color:#1A1A1A;">v</span><span style="font-family:'DM Serif Display',serif;font-style:italic;font-size:44px;color:#1A1A1A;">.</span></div>
          <div style="aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,0.16);"></div>
          <div style="aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,0.16);"></div>
          <div style="aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,0.16);"></div>
          <div style="aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,0.16);"></div>
          <div style="aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,0.16);"></div>
        </div>
        <div style="position:absolute;left:0;right:0;top:118px;text-align:center;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;color:rgba(255,255,255,0.85);">Verso</div>
      </div>
      <span style="font-family:'Hanken Grotesk',sans-serif;font-size:12px;color:#8A857C;max-width:300px;line-height:1.5;">Leuchtet am stärksten zwischen anderen Icons.</span>
    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1500,&quot;height&quot;:620}}"></script>
</body>
</html>
